version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    commit-message:
      prefix: chore

updates:
  - package-ecosystem: cargo
    directories:
      - /office-sdk
      - /api-test
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies

  - package-ecosystem: nuget
    directory: /tools/pptx-validation
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
