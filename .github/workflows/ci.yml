name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  timestamp-metadata-proof:
    name: Timestamp metadata before-after proof
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: be6978105ae333b507a590df6b0c1ca5969a1268
          path: before
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: Prove the same two document-parser regressions before and after
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: python3 scripts/verify_time_metadata.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: time-metadata-proof-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/time-metadata-proof/
          if-no-files-found: error

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install cargo-audit from registry-verified source
        run: cargo install --locked --version 0.23.0 cargo-audit
      - name: Validate immutable package publication rules
        run: python3 -m unittest discover -s scripts -p test_office_release.py
      - name: Validate all targets, tests, docs, audits and MSRV
        run: make ci
      - name: Validate maintained timestamps and narrow feature boundaries
        run: |
          cargo +1.100.0 test --manifest-path office-sdk/Cargo.toml --lib --test maintained_time --no-default-features --features report --locked
          cargo +1.100.0 test --manifest-path office-sdk/Cargo.toml --lib --test report_model --no-default-features --features report-model --locked
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100
      - name: Validate report presentation and embedded workbooks with Microsoft schemas
        run: make validate-pptx
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

  legacy-msrv:
    name: Published source compatibility with Rust 1.95.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The last 0.2.0 main source predates mail-parser's Rust 1.98 requirement.
          ref: 5d38186c222d8c19db5bec2b0d2c8a1ce1942939
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
      - name: Retain the old source MSRV contract
        run: make msrv-check
