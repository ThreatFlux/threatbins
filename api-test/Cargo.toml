[package]
name = "office-api-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"

[dependencies]
tokio = { version = "1.54.0", features = ["full"] }
warp = { version = "0.4.3", features = ["server", "multipart", "websocket"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
bytes = "1.12.1"

[dev-dependencies]
warp = { version = "0.4.3", features = ["test"] }
