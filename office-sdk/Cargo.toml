[package]
name = "office-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust SDK and CLI for creating and parsing Office formats (DOCX, XLSX, PPTX, PDF, EML) with Markdown conversion"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-username/office-sdk"
keywords = ["office", "docx", "xlsx", "pptx", "pdf", "eml"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["full"]
report-model = ["dep:sha2"]
report = ["report-model", "dep:base64", "dep:printpdf", "dep:lopdf", "dep:zip", "dep:quick-xml", "dep:chrono", "dep:image"]
full = ["report", "image/default", "dep:serde-xml-rs", "dep:anyhow", "dep:pulldown-cmark", "dep:regex", "dep:pdf-writer", "dep:md5", "dep:clap", "dep:walkdir", "dep:indicatif", "dep:console", "dep:dialoguer", "dep:colored", "dep:dirs", "dep:lettre", "dep:mail-parser", "dep:mime", "dep:time", "dep:tokio", "dep:warp", "dep:bytes", "dep:futures-util", "dep:uuid"]

[dependencies]
zip = { version = "9.0.5", optional = true }
quick-xml = { version = "0.42.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = { version = "0.8.2", optional = true }
thiserror = "2.0.21"
anyhow = { version = "1.0.104", optional = true }
pulldown-cmark = { version = "0.13.6", optional = true }
regex = { version = "1.13.1", optional = true }
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
uuid = { version = "1.28.0", features = ["v4"] , optional = true }
printpdf = { version = "0.12.8", default-features = false , optional = true }
lopdf = { version = "0.45.0", default-features = false , optional = true }
pdf-writer = { version = "0.15.0", optional = true }
md5 = { version = "0.8.1", optional = true }
clap = { version = "4.6.7", features = ["derive", "color", "suggestions"] , optional = true }
serde_json = "1.0.154"
walkdir = { version = "2.5.0", optional = true }
indicatif = { version = "0.18.6", optional = true }
console = { version = "0.16.6", optional = true }
dialoguer = { version = "0.12.0", optional = true }
colored = { version = "3.1.1", optional = true }
dirs = { version = "7.0.0", optional = true }
lettre = { version = "0.11.23", optional = true }
mail-parser = { version = "0.11.9", optional = true }
mime = { version = "0.3.17", optional = true }
time = { version = "0.3.55", optional = true }
tokio = { version = "1.54.1", features = ["full"] , optional = true }
warp = { version = "0.4.3", features = ["server", "multipart", "websocket"] , optional = true }
bytes = { version = "1.12.1", optional = true }
futures-util = { version = "0.3.34", optional = true }
sha2 = { version = "0.11.1", optional = true }

[[bin]]
name = "office-cli"
required-features = ["full"]
path = "src/bin/office-cli-simple.rs"

[[bin]]
name = "office-api-server"
required-features = ["full"]
path = "src/bin/api-server.rs"

[[bin]]
name = "simple-api-server"
required-features = ["full"]
path = "src/bin/simple-api-server.rs"

[[bin]]
name = "standalone-api"
required-features = ["full"]
path = "src/bin/standalone-api.rs"

[[bin]]
name = "minimal-api"
required-features = ["full"]
path = "src/bin/minimal-api.rs"

[dev-dependencies]
tempfile = "3.27.0"
warp = { version = "0.4.3", features = ["test"] }

[[example]]
name = "report_render"
required-features = ["report"]

[[test]]
name = "report_rendering"
required-features = ["report"]

[[test]]
name = "report_model"
required-features = ["report-model"]
