[package]
name = "office-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust SDK and CLI for creating and parsing Office formats (DOCX, XLSX, PPTX, PDF, EML) with Markdown conversion"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-username/office-sdk"
keywords = ["office", "docx", "xlsx", "pptx", "pdf", "eml"]
categories = ["parser-implementations", "encoding"]

[dependencies]
zip = "9.0.5"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8.2"
thiserror = "2.0.21"
anyhow = "1.0.104"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
image = "0.25.10"
uuid = { version = "1.28.0", features = ["v4"] }
printpdf = { version = "0.12.8", default-features = false }
lopdf = { version = "0.45.0", default-features = false }
pdf-writer = "0.15.0"
md5 = "0.8.1"
clap = { version = "4.6.7", features = ["derive", "color", "suggestions"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
indicatif = "0.18.6"
console = "0.16.6"
dialoguer = "0.12.0"
colored = "3.1.1"
dirs = "7.0.0"
lettre = "0.11.23"
mail-parser = "0.11.9"
mime = "0.3.17"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["full"] }
warp = { version = "0.4.3", features = ["server", "multipart", "websocket"] }
bytes = "1.12.1"
futures-util = "0.3.34"

[[bin]]
name = "office-cli"
path = "src/bin/office-cli-simple.rs"

[[bin]]
name = "office-api-server"
path = "src/bin/api-server.rs"

[[bin]]
name = "simple-api-server"
path = "src/bin/simple-api-server.rs"

[[bin]]
name = "standalone-api"
path = "src/bin/standalone-api.rs"

[[bin]]
name = "minimal-api"
path = "src/bin/minimal-api.rs"

[dev-dependencies]
tempfile = "3.27.0"
warp = { version = "0.4.3", features = ["test"] }
